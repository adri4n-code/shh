<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Head Spa · Cupón regalo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Karla:wght@400;500&display=swap');

  :root{
    --clay: #A9765F;
    --moss: #5C6B4F;
    --linen: #F1ECE2;
    --ink: #2B2620;
    --stone: #C9C0AE;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--linen);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .card{
    max-width: 440px;
    width:100%;
    text-align:center;
  }

  .steam{
    width: 46px;
    height: 46px;
    margin: 0 auto 28px;
    opacity: 0.55;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.1rem;
    line-height: 1.15;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .place{
    font-size: 0.98rem;
    color: var(--moss);
    margin: 0 0 6px;
  }

  .until{
    font-size: 0.88rem;
    color: #7A7264;
    margin: 0 0 34px;
  }

  a.open{
    display: inline-block;
    background: var(--clay);
    color: var(--linen);
    text-decoration: none;
    font-family: 'Karla', sans-serif;
    font-weight: 500;
    font-size: 1.02rem;
    padding: 16px 40px;
    border-radius: 3px;
    transition: background 0.25s ease, transform 0.25s ease;
  }

  a.open:hover{
    background: #8F6350;
    transform: translateY(-1px);
  }

  a.open:active{
    transform: translateY(0);
  }

  a.open:focus-visible{
    outline: 2px solid var(--moss);
    outline-offset: 3px;
  }

  .note{
    margin-top: 22px;
    font-size: 0.82rem;
    color: #8B8272;
  }

  @media (prefers-reduced-motion: reduce){
    a.open{ transition: none; }
  }
</style>
</head>
<body>

  <div class="card">
    <svg class="steam" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 40C10 34 16 30 14 24C12 18 18 14 16 8" stroke="#5C6B4F" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M24 40C20 34 26 30 24 24C22 18 28 14 26 8" stroke="#5C6B4F" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M34 40C30 34 36 30 34 24C32 18 38 14 36 8" stroke="#5C6B4F" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

    <h1>Head Spa<br>Tratamiento capilar</h1>
    <p class="place">Essence By Quiropa · 45 minutos</p>
    <p class="until">Válido hasta el 15.09.2026</p>

    <a class="open" href="cupon.pdf" target="_blank" rel="noopener">Abrir cupón</a>

    <p class="note">Se abrirá en una pestaña nueva</p>
  </div>

</body>
</html>
